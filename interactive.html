<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>What If... | ThriveU</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Fraunces:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{--paper:#F7F6F2;--ink:#2C3531;--muted:#5E6560;--sage:#8FA99A;--accent:#D4A373;--line:rgba(44,53,49,.10);}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--paper);color:var(--ink);font-family:'Inter',system-ui,sans-serif;line-height:1.6;min-height:100vh;}
a{color:inherit;}
.page{max-width:1000px;margin:0 auto;padding:26px 20px 40px;}
.topbar{display:flex;justify-content:space-between;align-items:baseline;gap:16px;margin-bottom:18px;flex-wrap:wrap;}
.back{text-decoration:none;font-size:.86rem;color:var(--muted);border-bottom:1px solid transparent;padding-bottom:2px;}
.back:hover{border-color:var(--muted);color:var(--ink);}
.title{font-family:'Fraunces',Georgia,serif;font-size:1rem;font-style:italic;color:var(--muted);}
.stage{position:relative;width:100%;aspect-ratio:4/3;background:#0B1114;border-radius:18px;overflow:hidden;box-shadow:0 24px 60px -30px rgba(44,53,49,.55);isolation:isolate;}
#scene{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:filter .55s ease;z-index:1;}
#student{position:absolute;left:1.5%;bottom:0;height:57%;z-index:2;display:none;}
#cups{position:absolute;right:20%;bottom:2%;width:26%;z-index:3;display:none;}
#water{position:absolute;left:19%;bottom:8%;width:17%;z-index:3;display:none;}
#hud{position:absolute;top:2.6%;right:2.6%;width:17.5%;z-index:5;}
#caption{position:absolute;left:4%;bottom:3%;width:92%;z-index:6;opacity:0;transition:opacity .18s ease;cursor:pointer;}
#caption.show{opacity:1;}
#buttons{position:absolute;inset:0;z-index:7;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:1.2%;opacity:0;pointer-events:none;transition:opacity .2s ease;}
#buttons.show{opacity:1;pointer-events:auto;}
.choice{width:86%;cursor:pointer;transition:transform .16s ease, filter .16s ease;filter:drop-shadow(0 6px 18px rgba(0,0,0,.25));}
.choice:hover{transform:translateX(6px);filter:drop-shadow(0 10px 24px rgba(0,0,0,.35));}
#start{position:absolute;left:50%;bottom:7%;transform:translateX(-50%);width:36%;z-index:8;cursor:pointer;filter:drop-shadow(0 8px 22px rgba(0,0,0,.3));transition:transform .18s ease;}
#start:hover{transform:translateX(-50%) scale(1.03);}
#again{display:none;position:absolute;left:50%;bottom:6%;transform:translateX(-50%);z-index:8;text-decoration:none;font-size:.9rem;font-weight:500;padding:11px 26px;border-radius:30px;background:var(--ink);color:#fff;}
#again:hover{background:var(--sage);}
.bubble{position:absolute;z-index:4;pointer-events:none;animation:bubble 3.8s ease forwards;}
@keyframes bubble{0%{opacity:0;transform:scale(.55) translateY(10px);}12%{opacity:1;transform:scale(1) translateY(0);}75%{opacity:1;}100%{opacity:0;transform:scale(1.05) translateY(-26px);}}
.shake{animation:shake .09s linear infinite;}
@keyframes shake{0%{transform:translate(0,0);}25%{transform:translate(6px,-3px);}50%{transform:translate(-5px,3px);}75%{transform:translate(4px,2px);}100%{transform:translate(0,0);}}
.note{margin-top:14px;display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:.76rem;flex-wrap:wrap;}
@media (max-width:640px){.page{padding:16px 12px 28px;}.stage{border-radius:12px;}.choice{width:92%;}#caption{width:94%;left:3%;}}
</style>
</head>
<body>
<div class="page">
  <div class="topbar">
    <a class="back" href="index.html">&larr; Back to ThriveU</a>
    <span class="title">What if... the night before the midterm</span>
  </div>

  <div class="stage" id="stage">
    <img id="scene" alt="">
    <img id="student" src="ui/student_sit.svg" alt="">
    <img id="cups" alt="">
    <img id="water" alt="">
    <img id="hud" alt="">
    <img id="caption" alt="">
    <div id="buttons"></div>
    <img id="start" src="ui/start.svg" alt="Begin">
    <a id="again" href="interactive.html">Play again</a>
  </div>

  <div class="note">
    <span>Sound on &middot; headphones recommended</span>
    <span>CS1102 &middot; SDG 3 &middot; no data leaves your browser</span>
  </div>
</div>

<script>
const CAPS = {"p1": {"text": "The midterm is tomorrow. You've barely covered half the slides.", "kind": "narration"}, "p2": {"text": "The group chat is still alive.", "kind": "narration"}, "p3": {"text": "“just finished my 3rd review, still so nervous lol.”", "kind": "phone"}, "p4": {"text": "“yeah i'm on my 4th run, we got this.”", "kind": "phone"}, "p5": {"text": "Are they for real? Why is everyone so far ahead…", "kind": "monologue"}, "s1a": {"text": "I just wanted a 5-minute break. It's midnight now.", "kind": "monologue"}, "s1b": {"text": "Heart's racing. But I can't stop now.", "kind": "monologue"}, "s1c": {"text": "Still panicking. But at least my head is clear.", "kind": "monologue"}, "act2": {"text": "The building is asleep.", "kind": "narration"}, "rA": {"text": "You open the book, but everything looks unfamiliar. You're out of time.", "kind": "narration"}, "rA2": {"text": "The same page. The same loop. The clock is louder than the code.", "kind": "narration"}, "rB": {"text": "Your vision is blurring. The lines of code are overlapping.", "kind": "narration"}, "rB2": {"text": "You read the same line four times. It still doesn't make sense.", "kind": "narration"}, "rC": {"text": "You have time. But you're still stuck on this logic.", "kind": "narration"}, "rC2": {"text": "The room is quiet. The question isn't.", "kind": "narration"}, "a1": {"text": "You restart from page one. By page three, you're reading the same line again.", "kind": "narration"}, "a2": {"text": "You skip it. Your hand keeps moving. Something in your chest stays empty.", "kind": "narration"}, "a3": {"text": "You ask the group. Twenty minutes later: “No response…”", "kind": "narration"}, "noresp": {"text": "No response.", "kind": "monologue"}, "a3b": {"text": "You put the phone down. The silence is louder than the answer.", "kind": "narration"}, "b1": {"text": "Another cup. Your heart hits your ribs like a drum.", "kind": "narration"}, "b1b": {"text": "The screen shakes. Or maybe that's you.", "kind": "narration"}, "b2": {"text": "Cold water. The face in the mirror has red eyes.", "kind": "narration"}, "b3": {"text": "You set an alarm for 6 AM. Two hours. That's enough. It has to be.", "kind": "narration"}, "b3ok": {"text": "The alarm goes off before the sky is light.", "kind": "narration"}, "b3bad": {"text": "The alarm never goes off.", "kind": "narration"}, "c1": {"text": "Forty minutes. Then the thought: maybe I'm not built for this.", "kind": "narration"}, "c1b": {"text": "The color drains out of the room.", "kind": "narration"}, "c2": {"text": "You annotate the question and close the laptop.", "kind": "narration"}, "c2b": {"text": "Your heart is still fast. But you're lying down.", "kind": "narration"}, "c3": {"text": "You text the TA at 2 AM. You know no one will answer.", "kind": "narration"}, "c3b": {"text": "Still, sending it makes the room feel less empty.", "kind": "narration"}, "act3": {"text": "The hall smells of paper and floor polish.", "kind": "narration"}, "arrive": {"text": "You stand outside the hall, flipping through the notes one last time.", "kind": "narration"}, "arrive_slept": {"text": "Woke up before the alarm. At least I got some sleep.", "kind": "narration"}, "arrive_late": {"text": "Overslept. Forgot my pens. Great.", "kind": "narration"}, "arrive_tired": {"text": "You walk in with your eyes half shut.", "kind": "narration"}, "ta": {"text": "The TA stops at your desk. “Check the loop condition on question 3. You got this.”", "kind": "narration"}, "shaking": {"text": "Your hands are shaking. You can't even hold the pen.", "kind": "narration"}, "bell": {"text": "The bell rings. The paper is handed out.", "kind": "narration"}, "hands": {"text": "My hands are shaking. I can't even hold the pen.", "kind": "monologue"}, "o1": {"text": "Question one is the loop from last night.", "kind": "narration"}, "o2": {"text": "The room narrows. The edges go black.", "kind": "narration"}, "o3": {"text": "You read the question three times. None of it stays.", "kind": "narration"}, "o4": {"text": "Your stress is overloaded. Remember: it's okay to reach out for help. A grade does not define your worth.", "kind": "narration"}, "h1": {"text": "You breathe out and start with what you know.", "kind": "narration"}, "h2": {"text": "Some questions are impossible. You skip them.", "kind": "narration"}, "h3": {"text": "You write down everything you knew.", "kind": "narration"}, "h4": {"text": "You survived. It wasn't perfect, but you made it through.", "kind": "narration"}, "s1": {"text": "You answer calmly. What you know, you write.", "kind": "narration"}, "s2": {"text": "The sun moves across the desk.", "kind": "narration"}, "s3": {"text": "Finished. Whatever happens, I'm getting a good meal today.", "kind": "narration"}, "s4": {"text": "Emotions are not enemies. Acknowledging stress is the first step to controlling it.", "kind": "narration"}, "end": {"text": "— END —", "kind": "narration"}};
const ASSETS = "";
const $ = id => document.getElementById(id);
const sceneImg = $("scene"), student = $("student"), cups = $("cups"),
      water = $("water"), hud = $("hud"), capImg = $("caption"),
      buttons = $("buttons"), stage = $("stage"), startBtn = $("start"), again = $("again");

const S = { stress: 35, energy: 95, time: 4, route: "", slept: 0, ta: 0, over: 0 };
let sceneName = "title";
let audioOn = false;

const sound = {
  tick: new Audio(ASSETS + "audio/tick.wav"),
  heart: new Audio(ASSETS + "audio/heartbeat.wav"),
  rain: new Audio(ASSETS + "audio/rain.wav")
};
Object.values(sound).forEach(a => { a.loop = true; a.preload = "auto"; });
const volumes = { tick: 0.18, heart: 0.5, rain: 0.35 };

const wait = ms => new Promise(r => setTimeout(r, ms));

function stopSound() {
  Object.values(sound).forEach(a => { a.pause(); a.currentTime = 0; });
}
function setSound(mode) {
  stopSound();
  if (!mode || !audioOn) return;
  const a = sound[mode];
  a.volume = volumes[mode];
  a.play().catch(() => {});
}
function updateSound() {
  if (!audioOn) return;
  if (["title", "final", "ending_slump", "ending_overload", "ending_hold", "ending_steady"].includes(sceneName)) {
    stopSound();
  } else if (S.stress > 60) {
    setSound("heart");
  } else if (S.route === "C") {
    setSound("rain");
  } else {
    setSound("tick");
  }
}

function setScene(name) {
  sceneName = name;
  sceneImg.src = ASSETS + "scenes/" + name + ".svg";
  updateProps();
  updateSound();
}
function setDark(v) {
  sceneImg.style.filter = "brightness(" + (1 - v / 100) + ")";
}
function updateProps() {
  const inRoom = sceneName === "dorm" || sceneName === "desk";
  student.style.display = inRoom ? "block" : "none";
  student.src = ASSETS + "ui/student_sit.svg";
  const desk = sceneName === "desk";
  cups.style.display = desk ? "block" : "none";
  if (desk) {
    const n = 1 + Math.min(3, Math.floor(S.stress / 30));
    cups.src = ASSETS + "ui/cups_" + n + ".svg";
  }
  water.style.display = (sceneName === "exam" && S.slept) ? "block" : "none";
  water.src = ASSETS + "ui/water.svg";
  hud.style.display = ["dorm", "desk", "exam"].includes(sceneName) ? "block" : "none";
  const v = Math.max(0, Math.min(100, Math.round(S.stress / 5) * 5));
  hud.src = ASSETS + "ui/hud_" + String(v).padStart(3, "0") + ".svg";
}

function shake(ms) {
  stage.classList.add("shake");
  setTimeout(() => stage.classList.remove("shake"), ms);
}
function bubbles(n, flood) {
  for (let i = 0; i < n; i++) {
    const img = document.createElement("img");
    img.src = ASSETS + "ui/bubble_999p.svg";
    img.className = "bubble";
    img.style.left = (4 + Math.random() * 82) + "%";
    img.style.top = (6 + Math.random() * 68) + "%";
    img.style.width = (7 + Math.random() * 8) + "%";
    img.style.animationDelay = (Math.random() * 0.5) + "s";
    stage.appendChild(img);
    setTimeout(() => img.remove(), 4600);
  }
}
function clamp() {
  S.stress = Math.max(0, Math.min(100, S.stress));
  S.energy = Math.max(0, Math.min(100, S.energy));
  updateProps();
  updateSound();
}

async function cap(key) {
  const c = CAPS[key];
  if (!c) return;
  capImg.src = ASSETS + "caps/cap_" + key + ".svg";
  capImg.classList.add("show");
  const dur = Math.min(8200, Math.max(2600, 1300 + c.text.length * 55));
  await new Promise(res => {
    let done = false;
    const finish = () => {
      if (done) return;
      done = true;
      clearTimeout(t);
      capImg.onclick = null;
      res();
    };
    const t = setTimeout(finish, dur);
    capImg.onclick = finish;
  });
  capImg.classList.remove("show");
  await wait(170);
}

function choose(options) {
  return new Promise(res => {
    buttons.innerHTML = "";
    options.forEach(o => {
      const img = document.createElement("img");
      img.src = ASSETS + "ui/btn_" + o.img + ".svg";
      img.className = "choice";
      img.alt = o.value;
      img.onclick = () => {
        buttons.classList.remove("show");
        buttons.innerHTML = "";
        res(o.value);
      };
      buttons.appendChild(img);
    });
    buttons.classList.add("show");
  });
}

async function poster(name) {
  capImg.classList.remove("show");
  buttons.classList.remove("show");
  hud.style.display = "none";
  student.style.display = "none";
  cups.style.display = "none";
  water.style.display = "none";
  sceneName = name;
  sceneImg.src = ASSETS + "scenes/" + name + ".svg";
  stopSound();
  await wait(5200);
  sceneName = "final";
  sceneImg.src = ASSETS + "scenes/final.svg";
  again.style.display = "block";
  stopSound();
}

async function run() {
  setScene("dorm"); setDark(0); clamp(); bubbles(8);
  for (const k of ["p1","p2","p3","p4","p5"]) await cap(k);

  let c = await choose([{img:"s1_A",value:"A"},{img:"s1_B",value:"B"},{img:"s1_C",value:"C"}]);
  if (c === "A") {
    S.stress += 30; S.energy -= 10; S.time -= 2; S.route = "A";
    setDark(20); bubbles(24, true); clamp(); await cap("s1a");
  } else if (c === "B") {
    S.stress += 50; S.energy -= 30; S.time += 1; S.route = "B";
    setDark(4); shake(900); clamp(); await cap("s1b");
  } else {
    S.stress -= 20; S.energy -= 5; S.route = "C";
    setDark(0); clamp(); await cap("s1c");
  }

  setScene("desk");
  setDark(S.route === "A" ? 10 : (S.route === "B" ? 12 : 0));
  clamp();
  await cap("act2");
  if (S.route === "A") { shake(700); await cap("rA"); await cap("rA2"); }
  if (S.route === "B") { await cap("rB"); await cap("rB2"); }
  if (S.route === "C") { await cap("rC"); await cap("rC2"); }

  const secondOptions = {
    A: [{img:"rA_A1",value:"A1"},{img:"rA_A2",value:"A2"},{img:"rA_A3",value:"A3"}],
    B: [{img:"rB_B1",value:"B1"},{img:"rB_B2",value:"B2"},{img:"rB_B3",value:"B3"}],
    C: [{img:"rC_C1",value:"C1"},{img:"rC_C2",value:"C2"},{img:"rC_C3",value:"C3"}]
  };
  c = await choose(secondOptions[S.route]);

  if (c === "A1") { S.stress += 20; S.energy -= 20; S.time -= 1.5; setDark(16); clamp(); await cap("a1"); }
  if (c === "A2") { S.stress -= 10; S.time -= 1; setDark(6); clamp(); await cap("a2"); }
  if (c === "A3") {
    S.stress -= 15; setDark(10); clamp(); await cap("a3");
    await cap("noresp"); S.stress += 10; clamp(); await cap("a3b");
  }
  if (c === "B1") { S.stress += 30; S.energy -= 20; setDark(18); clamp(); shake(3000); await cap("b1"); await cap("b1b"); }
  if (c === "B2") { S.stress -= 15; S.energy += 10; S.time -= 0.5; setDark(4); clamp(); await cap("b2"); }
  if (c === "B3") {
    S.stress -= 25; S.energy += 40; S.time -= 2; S.slept = 1; setDark(0); clamp(); await cap("b3");
    if (Math.random() < 0.5) { S.over = 1; await cap("b3bad"); } else { await cap("b3ok"); }
  }
  if (c === "C1") { S.stress += 35; S.energy -= 15; setDark(10); clamp(); shake(800); await cap("c1"); await cap("c1b"); }
  if (c === "C2") { S.stress -= 25; S.energy += 30; S.time -= 1; S.slept = 1; setDark(0); clamp(); await cap("c2"); await cap("c2b"); }
  if (c === "C3") { S.stress -= 10; S.ta = 1; clamp(); await cap("c3"); await cap("c3b"); }

  setScene("exam"); setDark(0); clamp();
  await cap("act3");
  if (S.over) await cap("arrive_late");
  else if (S.slept) await cap("arrive_slept");
  else if (S.energy < 30) await cap("arrive_tired");
  else await cap("arrive");
  if (S.ta) await cap("ta");
  if (S.stress > 60) await cap("shaking");
  await cap("bell");

  if (S.stress > 60) {
    setScene("ending_slump"); setDark(6); shake(3000);
    await cap("hands"); await cap("o1"); await cap("o2"); await cap("o3"); await cap("o4");
    await poster("ending_overload");
  } else if (S.stress >= 20) {
    setScene("exam"); setDark(0);
    await cap("h1"); await cap("h2"); await cap("h3"); await cap("h4");
    await poster("ending_hold");
  } else {
    setScene("ending_dawn"); setDark(0);
    await cap("s1"); await cap("s2"); await cap("s3"); await cap("s4");
    await poster("ending_steady");
  }
}

startBtn.onclick = () => {
  audioOn = true;
  startBtn.style.display = "none";
  setSound("tick");
  run();
};
setScene("title");
if (location.hash === "#play") setTimeout(() => startBtn.click(), 120);
</script>
</body>
</html>
